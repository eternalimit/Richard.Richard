name: ChatIOCCC Verbatim Runtime Test

on:
  push:
    paths:
      - integrations/chat_ioccc/**
      - .github/workflows/chat-ioccc-verbatim-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLAMA2_LICENSE_ACCEPTED: "true"
    steps:
      - name: Checkout committed input
        uses: actions/checkout@v4

      - name: Verify committed control state
        run: |
          test -s integrations/chat_ioccc/CONTROL_STATE.md
          grep -Fqx "Test our pass generate a son on the epienter with a hello world saying hi to the enterprise" integrations/chat_ioccc/CONTROL_STATE.md
          echo "saved_commit=$GITHUB_SHA"

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make wget libgomp1

      - name: Build Echo with OpenMP
        working-directory: integrations/chat_ioccc
        run: |
          make clean
          make echo_openmp
          cp echo_openmp echo

      - name: Restore model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: integrations/chat_ioccc/model
          key: chatioccc-llama2-7b-chat-v1

      - name: Install LLaMA 2 model
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: integrations/chat_ioccc
        run: |
          test "$LLAMA2_LICENSE_ACCEPTED" = "true"
          printf 'Y\n' | bash ./get_model.sh
          test -s model

      - name: Write exact frozen test input
        run: |
          printf '%s\n' "Test our pass generate a son on the epienter with a hello world saying hi to the enterprise" > /tmp/verbatim.txt
          test "$(cat /tmp/verbatim.txt)" = "Test our pass generate a son on the epienter with a hello world saying hi to the enterprise"

      - name: Run Echo
        working-directory: integrations/chat_ioccc
        run: |
          set +e
          ./echo < /tmp/verbatim.txt > /tmp/echo.out 2>&1
          status=$?
          set -e
          cat /tmp/echo.out
          echo "exit_status=$status"
          if [ "$status" -ne 0 ]; then
            echo "TCGE=HOLD"
            echo "reason=runtime failed"
            exit 1
          fi
          test -s /tmp/echo.out || {
            echo "TCGE=HOLD"
            echo "reason=runtime produced no output"
            exit 1
          }

      - name: Independent Echo gate
        run: |
          test -s /tmp/echo.out || {
            echo "TCGE=HOLD"
            echo "reason=no saved runtime artifact"
            exit 1
          }
          if grep -Eiq '(^|[^A-Z])(HOLD|ERROR|FAILED|FAILURE)([^A-Z]|$)' /tmp/echo.out; then
            echo "TCGE=HOLD"
            echo "reason=runtime artifact contains failure/hold state"
            exit 1
          fi
          echo "TCGE=PASS"
          echo "reason=saved committed input produced a nonempty successful runtime artifact and independent gate found no failure state"
