name: ChatIOCCC Verbatim Runtime Test

on:
  push:
    paths:
      - "integrations/chat_ioccc/**"
      - ".github/workflows/chat-ioccc-verbatim-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-verbatim-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Echo binary
        working-directory: integrations/chat_ioccc
        run: make clean && make
      - name: Preserve verbatim test input
        run: |
          printf '%s
' 'Test our pass generate a son on the epienter with a hello world saying hi to the enterprise' > /tmp/verbatim.txt
          test "$(cat /tmp/verbatim.txt)" = 'Test our pass generate a son on the epienter with a hello world saying hi to the enterprise'
      - name: Execute Echo runtime
        working-directory: integrations/chat_ioccc
        shell: bash
        run: |
          set +e
          OUTPUT=$(cat /tmp/verbatim.txt | ./echo 2>&1)
          STATUS=$?
          printf '%s
' "$OUTPUT"
          printf 'exit_status=%s
' "$STATUS"
          if printf '%s' "$OUTPUT" | grep -q 'model not found'; then
            echo 'TCGE=HOLD'
            echo 'reason=model artifact missing; verbatim input preserved and runtime reached'
            exit 0
          fi
          echo 'TCGE=HOLD'
          echo 'reason=unexpected runtime result; no model output validated'
          exit 1
